name: postmerge-ci

# The upstream full-suite matrices include platforms and private runner groups
# that are outside this fork's Android-only release contract. Keep them
# available for an explicit parity investigation, but do not launch them on a
# release push.
on:
  workflow_dispatch:

jobs:
  # Keep reusable workflow calls alphabetized. Each child also retains its own
  # workflow_dispatch trigger for a narrower manual investigation.
  rust-ci-full:
    name: rust-ci-full
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  v8-canary:
    name: v8-canary
    uses: ./.github/workflows/v8-canary.yml
    secrets: inherit

  results:
    name: Postmerge CI results
    needs:
      - rust-ci-full
      - v8-canary
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Postmerge runs use the pushed main commit, so this helper always comes
      # from the same revision that defined the parent workflow.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
